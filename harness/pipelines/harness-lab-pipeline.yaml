pipeline:
  name: harness-lab-pipeline
  clone:
    connector: github_ksiprogramming
    repo: KsiProgramming/harness-cicd-lab
    depth: 1
  stages:
    - id: build_and_test
      name: build-and-test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - id: restore_build_test
          name: restore-build-test
          run-test:
            container:
              image: mcr.microsoft.com/dotnet/sdk:10.0
            shell: sh
            env:
              DOTNET_CLI_TELEMETRY_OPTOUT: "1"
              DOTNET_NOLOGO: "1"
            script: |
              set -e
              cd app
              dotnet --info | head -n 5
              dotnet test HarnessLab.slnx -c Release \
                --results-directory TestResults \
                --logger "junit;LogFileName=junit.xml" \
                --logger "console;verbosity=normal"
            report:
              type: junit
              path: app/TestResults/junit.xml
            intelligence:
              disabled: true
        - id: build_and_push_dockerhub
          name: build-and-push-dockerhub
          template:
            uses: buildAndPushToDocker
            with:
              connector: dockerhub_essaidlab
              repo: essaidlab/harness-lab-api
              build_mode: build_and_push
              caching: true
              dockerfile: app/Dockerfile
              context: app
              build_args:
                APP_VERSION: ${{ pipeline.sequenceId }}
              tags:
                - ${{ pipeline.sequenceId }}
