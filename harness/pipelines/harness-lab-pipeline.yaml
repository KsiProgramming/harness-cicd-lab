pipeline:
  name: harness-lab-pipeline
  inputs:
    branch:
      type: string
      default: main
  clone:
    connector: github_ksiprogramming
    repo: KsiProgramming/harness-cicd-lab
    depth: 1
    ref:
      type: branch
      name: ${{ inputs.branch }}
  stages:
    - id: build_and_test
      name: build-and-test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - id: restore_build_test
          name: restore-build-test
          run-test:
            container:
              image: mcr.microsoft.com/dotnet/sdk:10.0
            shell: sh
            env:
              DOTNET_CLI_TELEMETRY_OPTOUT: "1"
              DOTNET_NOLOGO: "1"
            script: |
              set -e
              cd app
              dotnet --info | head -n 5
              dotnet test HarnessLab.slnx -c Release \
                --results-directory TestResults \
                --logger "junit;LogFileName=junit.xml" \
                --logger "console;verbosity=normal"
            report:
              type: junit
              path: app/TestResults/junit.xml
            intelligence:
              disabled: true
        - id: prepare_image
          name: prepare-image
          run:
            shell: sh
            script: |
              set -e
              sed -i "s/^ARG APP_VERSION=.*/ARG APP_VERSION=${{ pipeline.sequenceId }}/" app/Dockerfile
              grep "^ARG APP_VERSION" app/Dockerfile
        - id: build_and_push_dockerhub
          name: build-and-push-dockerhub
          template:
            uses: buildAndPushToDocker
            with:
              connector: dockerhub_essaidlab
              repo: essaidlab/harness-lab-api
              build_mode: build_and_push
              caching: true
              dockerfile: app/Dockerfile
              context: app
              tags:
                - ${{ pipeline.sequenceId }}
                - ${{ codebase.commitSha }}
    - id: deploy_dev
      name: deploy-dev
      service:
        type: kubernetes
        items:
          - harness_lab_api
      environment:
        id: dev
        deploy-to: minikube_harness_lab
      runtime:
        kubernetes:
          namespace: harness-delegate-ng
          connector: minikube_cluster
      steps:
        - id: canary_deploy
          name: canary-deploy
          timeout: 10m
          template:
            uses: k8sCanaryDeployStep
            with:
              unit: count
              instances: "1"
        - id: canary_health
          name: canary-health
          timeout: 2m
          template:
            uses: httpStep
            with:
              url: http://harness-lab-api-canary.harness-lab.svc.cluster.local/healthz
              method: GET
              assertion: <+httpResponseCode> == 200
        - id: approve_promotion
          name: approve-promotion
          timeout: 30m
          approval:
            uses: harness
            with:
              message: Canary of run ${{ pipeline.sequenceId }} is healthy. Promote to all replicas?
              user-groups:
                - _project_all_users
              approvers-min-count: 1
              block-executor: false
              auto-approve: false
        - id: canary_delete
          name: canary-delete
          timeout: 10m
          template:
            uses: k8sCanaryDeleteStep
            with:
              resources: <+stage.steps.canary_deploy.output.outputVariables.canaryWorkloads>
              is_openshift: <+stage.steps.canary_deploy.output.outputVariables.isOpenshift>
        - id: rolling_deploy
          name: rolling-deploy
          timeout: 10m
          template:
            uses: k8sRollingDeployStep
      rollback:
        - group:
            steps:
              - id: rollback_canary_delete
                name: rollback-canary-delete
                template:
                  uses: k8sCanaryDeleteStep
                  with:
                    select_delete_resources: resources
                    resources: ${{rollback.data.PLUGIN_CANARY_WORKLOADS}}
                    is_openshift: ${{rollback.data.HARNESS_IS_OPENSHIFT}}
              - id: rollback_rolling
                name: rollback-rolling
                template:
                  uses: k8sRollingRollbackStep
      on-failure:
        errors: all
        action: stage-rollback
