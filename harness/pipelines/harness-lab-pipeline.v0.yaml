pipeline:
  name: harness-lab-pipeline
  identifier: harness_lab_pipeline
  orgIdentifier: default
  projectIdentifier: harness_lab
  tags:
    lab: harness-cicd
  properties:
    ci:
      codebase:
        connectorRef: github_ksiprogramming
        repoName: harness-cicd-lab
        build: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: build_and_test
        description: Compile and test the .NET API, then build and push the Docker image
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Restore Build Test
                  identifier: restore_build_test
                  spec:
                    image: mcr.microsoft.com/dotnet/sdk:10.0
                    shell: Sh
                    envVariables:
                      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
                      DOTNET_NOLOGO: "1"
                    command: |-
                      set -e
                      cd app
                      dotnet --info | head -n 5
                      dotnet test HarnessLab.slnx -c Release \
                        --results-directory TestResults \
                        --logger "junit;LogFileName=junit.xml" \
                        --logger "console;verbosity=normal"
                  reports:
                    type: JUnit
                    spec:
                      paths:
                        - app/TestResults/*.xml
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push to Docker Hub
                  identifier: build_and_push_dockerhub
                  spec:
                    connectorRef: dockerhub_essaidlab
                    repo: essaidlab/harness-lab-api
                    dockerfile: app/Dockerfile
                    context: app
                    buildArgs:
                      APP_VERSION: <+pipeline.sequenceId>-<+codebase.shortCommitSha>
                    tags:
                      - <+pipeline.sequenceId>
                      - <+codebase.shortCommitSha>
