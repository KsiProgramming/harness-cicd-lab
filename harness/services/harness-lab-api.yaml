service:
  name: harness-lab-api
  identifier: harness_lab_api
  orgIdentifier: default
  projectIdentifier: harness_lab
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: k8s_manifests
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: github_ksiprogramming
                  gitFetchType: Branch
                  repoName: harness-cicd-lab
                  branch: main
                  paths:
                    - k8s/templates
              valuesPaths:
                - k8s/values.yaml
              skipResourceVersioning: false
      artifacts:
        primary:
          primaryArtifactRef: dockerhub_image
          sources:
            - identifier: dockerhub_image
              type: DockerRegistry
              spec:
                connectorRef: dockerhub_essaidlab
                imagePath: essaidlab/harness-lab-api
                tag: <+pipeline.sequenceId>
